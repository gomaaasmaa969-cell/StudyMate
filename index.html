<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate - رفيقك الذكي في المذاكرة</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1D63DC;
            --dark-navy: #1E3A5F;
            --soft-bg: #EEF5FF;
            --card-bg: #FFFFFF;
            --accent-gold: #F59E0B;
            --text-gray: #475569;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', system-ui, sans-serif; }
        body {
            background: linear-gradient(180deg, #E0EEFF 0%, #F4F9FF 50%, #E6F0FF 100%);
            color: var(--dark-navy); line-height: 1.6; padding: 18px; min-height: 100vh; overflow-x: hidden;
        }
        .hidden { display: none !important; }
        .bg-decoration { position: fixed; border-radius: 50%; z-index: -1; filter: blur(40px); }
        .circle-1 { width: 300px; height: 300px; background: rgba(59, 130, 246, 0.15); top: -80px; right: -80px; }
        .circle-2 { width: 280px; height: 280px; background: rgba(245, 158, 11, 0.12); bottom: 50px; left: -80px; }
        .navbar {
            background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); max-width: 1100px;
            margin: 0 auto 25px; padding: 12px 25px; border-radius: 50px; display: flex;
            justify-content: space-between; align-items: center; box-shadow: 0 8px 25px rgba(29, 99, 220, 0.08); border: 2px solid #FFF;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.45rem; color: var(--dark-navy); cursor: pointer; }
        .logo-icon {
            background: linear-gradient(135deg, #1D63DC, #3B82F6); color: white; width: 42px; height: 42px;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
        }
        .logo strong { color: var(--primary-blue); }
        .nav-links { list-style: none; display: flex; gap: 12px; }
        .nav-links a { text-decoration: none; color: var(--text-gray); font-weight: 700; padding: 7px 18px; border-radius: 25px; transition: 0.3s; }
        .nav-links a.active, .nav-links a:hover { background: linear-gradient(135deg, #1D63DC, #3B82F6); color: white; }
        .hero { max-width: 1100px; margin: 0 auto 35px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 15px 20px; }
        .hero-content { flex: 1.1; }
        .welcome-tag { display: inline-block; background: #FEF3C7; color: #B45309; font-weight: 700; font-size: 0.9rem; padding: 5px 15px; border-radius: 20px; margin-bottom: 12px; }
        .hero-content h1 { font-size: 2.4rem; font-weight: 900; margin-bottom: 12px; line-height: 1.3; }
        .brand-highlight { color: var(--primary-blue); position: relative; display: inline-block; }
        .brand-highlight::after { content: ""; position: absolute; bottom: 2px; left: 0; width: 100%; height: 6px; background: var(--accent-gold); border-radius: 10px; }
        .hero-content p { font-size: 1.1rem; color: var(--text-gray); margin-bottom: 25px; font-weight: 600; }
        .btn-primary {
            background: linear-gradient(135deg, #1D63DC, #2563EB); color: white; border: none; padding: 15px 35px;
            font-size: 1.1rem; font-weight: 800; border-radius: 50px; cursor: pointer; display: inline-flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(29, 99, 220, 0.35); transition: 0.2s;
        }
        .btn-primary:hover { transform: translateY(-3px); }
        .hero-visual { flex: 0.9; display: flex; justify-content: center; }
        .hero-illustration { font-size: 8rem; animation: float 4s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .features { max-width: 1100px; margin: 0 auto 35px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .feature-card {
            background: var(--card-bg); padding: 25px 18px; border-radius: 28px; text-align: center;
            box-shadow: 0 10px 25px rgba(29, 99, 220, 0.07); border: 2px solid #FFF; transition: 0.3s; cursor: pointer;
        }
        .feature-card:hover { transform: translateY(-6px); }
        .icon-box { width: 65px; height: 65px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 1.8rem; }
        .card-blue .icon-box { background: #DBEAFE; }
        .card-green .icon-box { background: #D1FAE5; }
        .card-orange .icon-box { background: #FEF3C7; }
        .card-purple .icon-box { background: #EDE9FE; }
        .feature-card h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
        .feature-card p { font-size: 0.95rem; color: var(--text-gray); font-weight: 600; }
        .motivation-banner {
            background: linear-gradient(135deg, #1E3A8A, #1D63DC); color: white; max-width: 900px; margin: 0 auto;
            padding: 16px 30px; border-radius: 50px; display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 1.15rem; font-weight: 800;
        }
        .wizard-container {
            max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.92); padding: 30px;
            border-radius: 35px; box-shadow: 0 15px 40px rgba(29, 99, 220, 0.1); border: 2px solid #FFF;
        }
        .btn-back { background: #F1F5F9; color: var(--text-gray); border: none; padding: 8px 18px; border-radius: 20px; font-weight: 700; cursor: pointer; margin-bottom: 15px; }
        .wizard-header { text-align: center; margin-bottom: 30px; }
        .step-badge { background: #DBEAFE; color: var(--primary-blue); padding: 4px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 800; }
        .wizard-header h2 { font-size: 1.8rem; font-weight: 900; margin: 10px 0 5px; }
        .wizard-header p { color: var(--text-gray); font-weight: 600; }
        .systems-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }
        .system-card { background: #FFF; padding: 28px 20px; border-radius: 28px; text-align: center; border: 2px solid #E2E8F0; transition: 0.3s; cursor: pointer; }
        .system-card:hover { border-color: var(--primary-blue); transform: translateY(-4px); }
        .system-icon { width: 70px; height: 70px; border-radius: 22px; font-size: 2.2rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; }
        .grade-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .grade-btn { background: #F8FAFC; color: var(--dark-navy); border: 2px solid #CBD5E1; padding: 12px 20px; border-radius: 18px; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
        .grade-btn:hover { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .tracks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 25px; }
        .track-card { background: #FFF; border: 2.5px solid #E2E8F0; border-radius: 22px; padding: 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .track-card.selected { border-color: var(--primary-blue); background: #EFF6FF; }
        .track-emoji { font-size: 2rem; width: 55px; height: 55px; background: #F1F5F9; border-radius: 16px; display: flex; align-items: center; justify-content: center; }
        .specialization-panel { background: #F8FAFC; border: 2px dashed var(--primary-blue); border-radius: 24px; padding: 22px; text-align: center; margin-bottom: 25px; }
        .spec-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 15px; }
        .spec-card { background: #FFF; border: 2px solid #CBD5E1; border-radius: 18px; padding: 15px; font-size: 1.1rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .spec-card.selected { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        .wizard-footer { text-align: center; }
        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; }
            .features { grid-template-columns: repeat(2, 1fr); }
            .tracks-grid, .spec-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-decoration circle-1"></div>
    <div class="bg-decoration circle-2"></div>

    <nav class="navbar">
        <div class="logo" onclick="showStep('step-welcome')">
            <div class="logo-icon">📚</div>
            <span>Study<strong>Mate</strong></span>
        </div>
        <ul class="nav-links">
            <li><a href="javascript:void(0)" class="active" onclick="showStep('step-welcome')">الرئيسية</a></li>
            <li><a href="javascript:void(0)" onclick="showStep('step-system')">إعداد المواد</a></li>
        </ul>
    </nav>

    <div id="step-welcome" class="view-section">
        <header class="hero">
            <div class="hero-content">
                <span class="welcome-tag">✨ رفيقك الذكي في الثانوية</span>
                <h1>نظّم مذاكرتك وحقق حلمك مع <span class="brand-highlight">StudyMate</span></h1>
                <p>منصة ذكية لإدارة مهامك الدراسية، متابعة موادك، وقياس ساعات تركيزك الفعلية حسب نظامك الدراسي.</p>
                <button type="button" class="btn-primary" onclick="showStep('step-system')">
                    <span>ابدأ رحلتك الدراسية الآن</span>
                    <span>←</span>
                </button>
            </div>
            <div class="hero-visual">
                <div class="hero-illustration">🎓</div>
            </div>
        </header>

        <section class="features">
            <div class="feature-card card-blue" onclick="openPage('step-tasks')">
